<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彩票系统 - 登录</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <h1>彩票购买抽奖系统</h1>

        <div id="errorMsg" class="alert alert-error hidden"></div>
        <div id="successMsg" class="alert alert-success hidden"></div>

        <!-- 登录表单 -->
        <div id="loginForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <button class="btn btn-primary" onclick="doLogin()">登录</button>
            <div class="switch-link">
                <a onclick="showRegister()">没有账号？点击注册</a>
            </div>
        </div>

        <!-- 注册表单 -->
        <div id="registerForm" style="display:none;">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="regUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="text" id="regPhone" placeholder="请输入手机号">
            </div>
            <button class="btn btn-primary" onclick="doRegister()">注册</button>
            <div class="switch-link">
                <a onclick="showLogin()">已有账号？点击登录</a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        // == 页面加载时检查自动登录 URL 参数 ==
        (function autoLoginCheck() {
            var params = new URLSearchParams(window.location.search);
            if (params.get('auto') === '1') {
                var username = params.get('username');
                var password = params.get('password') || '123';
                if (username) {
                    // 先尝试登录
                    apiPost('/login', { username: username, password: password }).then(function (res) {
                        if (res.code === 200) {
                            saveUser(res.data);
                            redirectAfterLogin(params);
                        } else {
                            // 登录失败，尝试注册
                            var phone = '130' + String(Math.floor(10000000 + Math.random() * 90000000));
                            apiPost('/register', {
                                username: username,
                                password: password,
                                phone: phone
                            }).then(function (regRes) {
                                if (regRes.code === 200) {
                                    saveUser(regRes.data);
                                } else {
                                    // 可能已存在但密码不对，再试一次登录
                                    apiPost('/login', { username: username, password: password }).then(function (r2) {
                                        if (r2.code === 200) {
                                            saveUser(r2.data);
                                        }
                                    });
                                }
                                redirectAfterLogin(params);
                            });
                        }
                    });
                }
            }
        })();

        function redirectAfterLogin(params) {
            window.location.href = 'index.html';
        }

        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            hideMessages();
        }

        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            hideMessages();
        }

        function doLogin() {
            hideMessages();
            var username = document.getElementById('loginUsername').value.trim();
            var password = document.getElementById('loginPassword').value.trim();
            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }

            apiPost('/login', { username: username, password: password }).then(function (res) {
                if (res.code === 200) {
                    saveUser(res.data);
                    window.location.href = 'index.html';
                } else {
                    showError(res.message || '登录失败');
                }
            });
        }

        function doRegister() {
            hideMessages();
            var username = document.getElementById('regUsername').value.trim();
            var password = document.getElementById('regPassword').value.trim();
            var phone = document.getElementById('regPhone').value.trim();
            if (!username || !password || !phone) {
                showError('请填写完整信息');
                return;
            }

            apiPost('/register', { username: username, password: password, phone: phone }).then(function (res) {
                if (res.code === 200) {
                    saveUser(res.data);
                    window.location.href = 'index.html';
                } else {
                    showError(res.message || '注册失败');
                }
            });
        }

        // 回车提交
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                var loginForm = document.getElementById('loginForm');
                if (loginForm.style.display !== 'none') {
                    doLogin();
                } else {
                    doRegister();
                }
            }
        });
    </script>
</body>
</html>
